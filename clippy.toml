allow-unwrap-in-tests = true
allow-expect-in-tests = true

# Ambient filesystem authority is banned outside `brush-vfs` and `sys`.
#
# Constructors, not types. `brush-vfs`'s own API hands back `std::fs::File` and
# `std::fs::Metadata` on purpose (see notes/2026-08-18-codemod-spike.md), so
# banning the types would make the facade one large `#[allow]` and prove
# nothing. A type carries no authority; the function that mints it does.
#
# An entry naming a path that does not resolve disables a ban almost invisibly:
# clippy emits a plain warning, not a lint, so `-D warnings` does not escalate
# it and the build stays green. That is what `cargo xtask check ban` exists to
# catch: it lints a fixture that uses every entry below exactly once and
# requires exactly one diagnostic per entry.
#
# The list bans *abilities*, not spellings. Every `nix` entry has a `libc` twin
# and vice versa, because banning one without the other only moves the call.
disallowed-methods = [
  # The free functions in std::fs, in the order the module documents them.
  { path = "std::fs::canonicalize", reason = "use brush_vfs::Vfs::canonicalize" },
  { path = "std::fs::copy", reason = "read and write through brush_vfs::Vfs" },
  { path = "std::fs::create_dir", reason = "use brush_vfs::Vfs::create_dir_all" },
  { path = "std::fs::create_dir_all", reason = "use brush_vfs::Vfs::create_dir_all" },
  { path = "std::fs::exists", reason = "use brush_vfs::Vfs::exists" },
  { path = "std::fs::hard_link", reason = "not expressible in the namespace yet" },
  { path = "std::fs::metadata", reason = "use brush_vfs::Vfs::metadata or facts" },
  { path = "std::fs::read", reason = "open through brush_vfs::Vfs" },
  { path = "std::fs::read_dir", reason = "use brush_vfs::Vfs::read_dir_names" },
  { path = "std::fs::read_link", reason = "use brush_vfs::Vfs::read_link" },
  { path = "std::fs::read_to_string", reason = "open through brush_vfs::Vfs" },
  { path = "std::fs::remove_dir", reason = "use brush_vfs::Vfs::remove_dir" },
  { path = "std::fs::remove_dir_all", reason = "use brush_vfs::Vfs::remove_dir_all" },
  { path = "std::fs::remove_file", reason = "use brush_vfs::Vfs::remove_file" },
  { path = "std::fs::rename", reason = "use brush_vfs::Vfs::rename" },
  { path = "std::fs::set_permissions", reason = "not expressible in the namespace yet" },
  { path = "std::fs::soft_link", reason = "use brush_vfs::Vfs::symlink" },
  { path = "std::fs::symlink_metadata", reason = "use brush_vfs::Vfs::facts with follow=false" },
  { path = "std::fs::write", reason = "open through brush_vfs::Vfs" },

  # The constructors that mint a handle out of a path.
  { path = "std::fs::File::open", reason = "use brush_vfs::Vfs::open" },
  { path = "std::fs::File::create", reason = "use brush_vfs::Vfs::create" },
  { path = "std::fs::File::create_new", reason = "use brush_vfs::OpenMode::create_new" },
  { path = "std::fs::File::options", reason = "use brush_vfs::OpenMode" },
  { path = "std::fs::OpenOptions::new", reason = "use brush_vfs::OpenMode" },
  { path = "std::fs::OpenOptions::open", reason = "use brush_vfs::Vfs::open_with" },
  { path = "std::fs::DirBuilder::new", reason = "use brush_vfs::Vfs::create_dir_all" },
  { path = "std::fs::DirBuilder::create", reason = "use brush_vfs::Vfs::create_dir_all" },

  # Inherent Path methods that do I/O. These read as pure predicates and are
  # the easiest way to reintroduce an ambient lookup by accident.
  { path = "std::path::Path::canonicalize", reason = "use brush_vfs::Vfs::canonicalize" },
  { path = "std::path::Path::exists", reason = "use brush_vfs::Vfs::exists" },
  { path = "std::path::Path::is_dir", reason = "use brush_vfs::Vfs::facts" },
  { path = "std::path::Path::is_file", reason = "use brush_vfs::Vfs::facts" },
  { path = "std::path::Path::is_symlink", reason = "use brush_vfs::Vfs::is_symlink" },
  { path = "std::path::Path::metadata", reason = "use brush_vfs::Vfs::metadata" },
  { path = "std::path::Path::read_dir", reason = "use brush_vfs::Vfs::read_dir_names" },
  { path = "std::path::Path::read_link", reason = "use brush_vfs::Vfs::read_link" },
  { path = "std::path::Path::symlink_metadata", reason = "use brush_vfs::Vfs::facts with follow=false" },
  { path = "std::path::Path::try_exists", reason = "use brush_vfs::Vfs::exists" },

  # Paths built from the process's own ambient position. `std::path::absolute`
  # is `getcwd(2)` plus a join, which is precisely what `absolute_path` does and
  # what the namespace exists to replace.
  { path = "std::path::absolute", reason = "use Session::resolve" },

  # The unix extension surface. `std::fs` is not the only door.
  { path = "std::os::unix::fs::symlink", reason = "use brush_vfs::Vfs::symlink, which validates the target" },
  { path = "std::os::unix::fs::chown", reason = "not expressible in the namespace yet" },
  { path = "std::os::unix::fs::lchown", reason = "not expressible in the namespace yet" },
  { path = "std::os::unix::fs::chroot", reason = "the namespace is the confinement, not chroot" },

  # Below std. The ban is on ambient authority, not on one crate's spelling of
  # it, and both of these are non-dev dependencies on unix.
  { path = "nix::unistd::access", reason = "use brush_vfs::Vfs::access" },
  { path = "nix::unistd::chdir", reason = "the namespace's cwd is per-session" },
  { path = "nix::unistd::getcwd", reason = "use Session::cwd" },
  { path = "nix::unistd::unlink", reason = "use brush_vfs::Vfs::remove_file" },
  { path = "nix::unistd::symlinkat", reason = "use brush_vfs::Vfs::symlink, which validates the target" },
  { path = "nix::sys::stat::stat", reason = "use brush_vfs::Vfs::facts" },
  { path = "nix::sys::stat::lstat", reason = "use brush_vfs::Vfs::facts with follow=false" },
  { path = "nix::fcntl::readlink", reason = "use brush_vfs::Vfs::read_link" },
  { path = "nix::dir::Dir::open", reason = "use brush_vfs::Vfs::read_dir_names" },
  { path = "nix::fcntl::open", reason = "use brush_vfs::Vfs::open_with" },
  { path = "nix::unistd::mkdir", reason = "use brush_vfs::Vfs::create_dir_all" },
  { path = "nix::unistd::unlinkat", reason = "use brush_vfs::Vfs::remove_file" },
  { path = "nix::unistd::truncate", reason = "open through brush_vfs::Vfs" },
  { path = "nix::unistd::chown", reason = "not expressible in the namespace yet" },
  { path = "nix::unistd::chroot", reason = "the namespace is the confinement, not chroot" },
  { path = "nix::sys::stat::mkdirat", reason = "use brush_vfs::Vfs::create_dir_all" },
  { path = "nix::sys::stat::utimes", reason = "not expressible in the namespace yet" },
  # Every nix ban has a libc twin, and banning one without the other bans a
  # spelling rather than an ability.
  { path = "libc::open", reason = "use brush_vfs::Vfs::open_with" },
  { path = "libc::openat", reason = "use brush_vfs::Vfs::open_with" },
  { path = "libc::creat", reason = "use brush_vfs::Vfs::create" },
  { path = "libc::chdir", reason = "the namespace's cwd is per-session" },
  { path = "libc::getcwd", reason = "use Session::cwd" },
  { path = "libc::access", reason = "use brush_vfs::Vfs::access" },
  { path = "libc::stat", reason = "use brush_vfs::Vfs::facts" },
  { path = "libc::lstat", reason = "use brush_vfs::Vfs::facts with follow=false" },
  { path = "libc::realpath", reason = "use brush_vfs::Vfs::canonicalize" },
  { path = "libc::readlink", reason = "use brush_vfs::Vfs::read_link" },
  { path = "libc::opendir", reason = "use brush_vfs::Vfs::read_dir_names" },
  { path = "libc::mkdir", reason = "use brush_vfs::Vfs::create_dir_all" },
  { path = "libc::rmdir", reason = "use brush_vfs::Vfs::remove_dir" },
  { path = "libc::unlink", reason = "use brush_vfs::Vfs::remove_file" },
  { path = "libc::rename", reason = "use brush_vfs::Vfs::rename" },
  { path = "libc::link", reason = "not expressible in the namespace yet" },
  { path = "libc::symlink", reason = "use brush_vfs::Vfs::symlink, which validates the target" },
  { path = "libc::truncate", reason = "open through brush_vfs::Vfs" },
  { path = "libc::chmod", reason = "not expressible in the namespace yet" },
  { path = "libc::chroot", reason = "the namespace is the confinement, not chroot" },
  # The `*at` family and the stdio wrappers, which the first pass missed even
  # though it banned their nix spellings.
  { path = "libc::fopen", reason = "use brush_vfs::Vfs::open_with" },
  { path = "libc::freopen", reason = "use brush_vfs::Vfs::open_with" },
  { path = "libc::tmpfile", reason = "scratch space is outside the namespace; see D38" },
  { path = "libc::remove", reason = "use brush_vfs::Vfs::remove_file" },
  { path = "libc::renameat", reason = "use brush_vfs::Vfs::rename" },
  { path = "libc::linkat", reason = "not expressible in the namespace yet" },
  { path = "libc::symlinkat", reason = "use brush_vfs::Vfs::symlink, which validates the target" },
  { path = "libc::readlinkat", reason = "use brush_vfs::Vfs::read_link" },
  { path = "libc::faccessat", reason = "use brush_vfs::Vfs::access" },
  { path = "libc::fchmodat", reason = "not expressible in the namespace yet" },
  { path = "libc::fchownat", reason = "not expressible in the namespace yet" },
  { path = "libc::utimensat", reason = "not expressible in the namespace yet" },
  { path = "libc::utimes", reason = "not expressible in the namespace yet" },
  { path = "libc::mkdirat", reason = "use brush_vfs::Vfs::create_dir_all" },
  { path = "libc::unlinkat", reason = "use brush_vfs::Vfs::remove_file" },
  { path = "libc::mkfifo", reason = "not expressible in the namespace yet" },
  { path = "libc::mkstemp", reason = "scratch space is outside the namespace" },
  { path = "libc::mkdtemp", reason = "scratch space is outside the namespace" },
  { path = "libc::fchdir", reason = "the namespace's cwd is per-session" },
  { path = "libc::lchown", reason = "not expressible in the namespace yet" },
  { path = "libc::opendir", reason = "use brush_vfs::Vfs::read_dir_names" },
  { path = "libc::fdopendir", reason = "use brush_vfs::Vfs::read_dir_names" },
  { path = "libc::readdir", reason = "use brush_vfs::Vfs::read_dir_names" },
  { path = "libc::pathconf", reason = "not expressible in the namespace yet" },
  # Executing a program is the namespace's business too; see the confused
  # deputy the plan records.
  { path = "libc::execv", reason = "use Shell::host_path_for_execution" },
  { path = "libc::execve", reason = "use Shell::host_path_for_execution" },
  { path = "libc::execvp", reason = "use Shell::host_path_for_execution" },
  { path = "libc::system", reason = "the closed world decides what may run; see D2" },
  { path = "libc::popen", reason = "the closed world decides what may run; see D2" },

  { path = "nix::unistd::fchdir", reason = "the namespace's cwd is per-session" },
  { path = "nix::unistd::linkat", reason = "not expressible in the namespace yet" },
  { path = "nix::unistd::mkfifo", reason = "not expressible in the namespace yet" },
  { path = "nix::unistd::pathconf", reason = "not expressible in the namespace yet" },
  { path = "nix::fcntl::openat", reason = "use brush_vfs::Vfs::open_with" },
  { path = "nix::fcntl::renameat", reason = "use brush_vfs::Vfs::rename" },
  { path = "nix::fcntl::readlinkat", reason = "use brush_vfs::Vfs::read_link" },
  { path = "nix::sys::stat::fstatat", reason = "use brush_vfs::Vfs::facts" },
  { path = "nix::sys::stat::fchmodat", reason = "not expressible in the namespace yet" },
  { path = "nix::sys::stat::mknod", reason = "not expressible in the namespace yet" },
  { path = "nix::sys::statvfs::statvfs", reason = "the host's filesystem layout is not the namespace's" },

  # A unix socket is named by a host path like anything else, and `bind`
  # *creates* a file outside every mount.
  { path = "std::os::unix::net::UnixStream::connect", reason = "not expressible in the namespace yet" },
  { path = "std::os::unix::net::UnixListener::bind", reason = "creates a host file outside every mount" },
  { path = "std::os::unix::net::UnixDatagram::bind", reason = "creates a host file outside every mount" },
  { path = "std::os::unix::net::UnixDatagram::connect", reason = "not expressible in the namespace yet" },
  { path = "std::os::unix::net::SocketAddr::from_pathname", reason = "a socket address is a host path" },

  # Scratch space outside every mount. Here-documents use `tempfile::tempfile`
  # deliberately (D38) and carry an exemption; nothing else should.
  # The three free functions are the thin wrappers; `Builder` is how the crate
  # documents doing the same thing, so banning only the wrappers bans the
  # shorthand and leaves the idiom.
  { path = "tempfile::tempfile", reason = "scratch space is outside the namespace; see D38" },
  { path = "tempfile::tempfile_in", reason = "scratch space is outside the namespace" },
  { path = "tempfile::tempdir", reason = "scratch space is outside the namespace" },
  { path = "tempfile::tempdir_in", reason = "scratch space is outside the namespace" },
  { path = "tempfile::spooled_tempfile", reason = "scratch space is outside the namespace" },
  { path = "tempfile::NamedTempFile::new", reason = "a named temporary is a host path" },
  { path = "tempfile::NamedTempFile::new_in", reason = "a named temporary is a host path" },
  { path = "tempfile::TempDir::new", reason = "scratch space is outside the namespace" },
  { path = "tempfile::TempDir::new_in", reason = "scratch space is outside the namespace" },
  { path = "tempfile::Builder::tempfile", reason = "scratch space is outside the namespace; see D38" },
  { path = "tempfile::Builder::tempfile_in", reason = "scratch space is outside the namespace" },
  { path = "tempfile::Builder::tempdir", reason = "scratch space is outside the namespace" },
  { path = "tempfile::Builder::tempdir_in", reason = "scratch space is outside the namespace" },
  { path = "tempfile::Builder::make", reason = "scratch space is outside the namespace" },
  { path = "tempfile::Builder::make_in", reason = "scratch space is outside the namespace" },
  { path = "tempfile::NamedTempFile::with_prefix", reason = "a named temporary is a host path" },
  { path = "tempfile::NamedTempFile::with_prefix_in", reason = "a named temporary is a host path" },
  { path = "tempfile::NamedTempFile::with_suffix", reason = "a named temporary is a host path" },
  { path = "tempfile::NamedTempFile::with_suffix_in", reason = "a named temporary is a host path" },
  { path = "tempfile::TempDir::with_prefix", reason = "scratch space is outside the namespace" },
  { path = "tempfile::TempDir::with_prefix_in", reason = "scratch space is outside the namespace" },
  { path = "tempfile::spooled_tempfile_in", reason = "scratch space is outside the namespace" },
  { path = "tempfile::env::temp_dir", reason = "the host's temp directory is not in the namespace" },

  # Hands a host path to a child process.
  { path = "std::process::Command::current_dir", reason = "the child's cwd comes from the session" },

  # Process-wide ambient state that names a place on the host.
  { path = "std::env::current_dir", reason = "use Session::cwd" },
  { path = "std::env::set_current_dir", reason = "the namespace's cwd is per-session" },
  { path = "std::env::current_exe", reason = "the host's layout is not the namespace's" },
  { path = "std::env::home_dir", reason = "HOME is synthesized by policy" },
  { path = "std::env::temp_dir", reason = "the host's temp directory is not in the namespace" },
]
