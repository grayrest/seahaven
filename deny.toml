[graph]
# If 1 or more target triples (and optionally, target_features) are specified,
# only the specified targets will be checked when running `cargo deny check`.
# This means, if a particular package is only ever used as a target specific
# dependency, such as, for example, the `nix` crate only being used via the
# `target_family = "unix"` configuration, that only having windows targets in
# this list would mean the nix crate, as well as any of its exclusive
# dependencies not shared by any other crates, would be ignored, as the target
# list here is effectively saying which targets you are building for.
targets = []
#exclude = []
all-features = false
no-default-features = false
#features = []

[output]
feature-depth = 1

# This section is considered when running `cargo deny check advisories`
# More documentation for the advisories section can be found here:
# https://embarkstudios.github.io/cargo-deny/checks/advisories/cfg.html
[advisories]
version = 2
yanked = "deny"
#db-path = "$CARGO_HOME/advisory-dbs"
#db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = [
    # Both advisories affect quick-xml's *parsing* paths (Attributes duplicate
    # check, NsReader namespace resolution). quick-xml is pulled in only via
    # junit-report (a dev-dependency for test reporting), which exclusively
    # *writes* XML and never parses untrusted input. Remove these once
    # junit-report releases with quick-xml >= 0.41.
    { id = "RUSTSEC-2026-0194", reason = "parse-only DoS; junit-report (dev-only) only writes XML" },
    { id = "RUSTSEC-2026-0195", reason = "NsReader-only DoS; junit-report (dev-only) only writes XML" },
]
#git-fetch-with-cli = true

# This section is considered when running `cargo deny check licenses`
# More documentation for the licenses section can be found here:
# https://embarkstudios.github.io/cargo-deny/checks/licenses/cfg.html
[licenses]
version = 2
# List of explicitly allowed licenses
# See https://spdx.org/licenses/ for list of possible licenses
# [possible values: any SPDX 3.11 short identifier (+ optional exception)].
allow = [
    "Apache-2.0",
    # cap-std's Windows layer (winx, and the rustix stack under it) carries the
    # LLVM exception, which is Apache-2.0 with an added grant rather than a
    # narrower licence. It arrived with brush-vfs.
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "NCSA",
    "Unicode-3.0",
    "WTFPL",
    "Zlib",
]
# The confidence threshold for detecting a license from license text.
# The higher the value, the more closely the license text must be to the
# canonical license text of a valid SPDX license file.
# [possible values: any between 0.0 and 1.0].
confidence-threshold = 0.8
# Allow 1 or more licenses on a per-crate basis, so that particular licenses
# aren't accepted for every possible crate as with the normal allow list
exceptions = []

[licenses.private]
ignore = false
registries = []

# This section is considered when running `cargo deny check bans`.
# More documentation about the 'bans' section can be found here:
# https://embarkstudios.github.io/cargo-deny/checks/bans/cfg.html
[bans]
multiple-versions = "allow"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
# List of crates that are allowed. Use with care!
allow = []
# List of crates to deny
#
# Every entry is a crate that walks, stats or mutates the filesystem with
# ambient authority, behind an API that gives the caller nowhere to hand a
# namespace. An `#[allow]` cannot contain one of these the way it contains a
# `std::fs` call, because the traversal happens inside the dependency: routing
# `brush-vfs` around it is not a matter of discipline, it is impossible. So the
# gate sits at the dependency graph rather than at the call site.
#
# `wrappers` names the direct parents that may still depend on one, and the
# list doubles as an inventory. Two kinds appear:
#
#   - Test and benchmark infrastructure, which observes the host on purpose --
#     the same exemption `brush-test-harness` carries for the clippy ban.
#   - The bundled uutils coreutils. Those are knowingly unrouted: routing them
#     is the forks-and-codemod milestone, deliberately left out of the vfs
#     foundation. Naming each parent rather than exempting the feature keeps
#     the ratchet -- a *new* coreutil reaching for one of these fails the check
#     until it is added here on purpose.
deny = [
  # Recursive directory traversal with no directory handle to anchor it.
  #
  # Down to one code path that could use it, from four. `find`, `grep -r` and
  # `cp -r` now walk through `brush_vfs::walk`, which descends by directory
  # capability and yields virtual paths, so their dependency on this crate is
  # gone rather than exempted.
  { crate = "walkdir", wrappers = [
    # Test and benchmark infrastructure.
    "brush-shell",
    "brush-test-harness",
    "criterion",
    "insta",
    # The reference implementation the walk is differentially tested against:
    # a dev-dependency of `brush-vfs`, and the most legitimate use of it here.
    "brush-vfs",
    # `sed`'s dev-dependencies reach it through `assert_fs`; nothing shipped does.
    "globwalk",
    "ignore",
    # `uu_tail -f` watches files, which has no namespace expression at all.
    "notify",
    # `uucore::perms::dive_into`, which is unreachable from anything bundled:
    # `chmod`, `chown` and `chgrp` are not in the coreutils set, and on Linux
    # `perms` uses the vfs-rooted `DirFd` path regardless. Porting it needs a
    # routed `chown` -- `libc::chown` takes a host path, so a virtual one from
    # the walk would be wrong -- which is real trusted-boundary code written for
    # a caller that does not exist. Left, and this comment is why.
    "uucore",
  ] },
  # Extended attributes, addressed by path; no `*at` form is exposed. This one
  # reaches further than the others: `uucore` is a dependency of
  # `brush-builtins` itself, not only of the bundled coreutils, so it is in the
  # default build. Extended attributes have no cap-std expression at all --
  # a recorded open decision, not something this milestone closes.
  { crate = "xattr", wrappers = ["uucore"] },
  # Sets timestamps by path.
  { crate = "filetime", wrappers = ["uu_cp", "uu_touch"] },
  # Recursive copy and move, by path.
  { crate = "fs_extra", wrappers = ["uu_mv"] },
  # Filesystem watching: holds paths and reports on them independently of any
  # namespace, and on some backends recurses.
  { crate = "notify", wrappers = ["uu_tail"] },
]

# This section is considered when running `cargo deny check sources`.
# More documentation about the 'sources' section can be found here:
# https://embarkstudios.github.io/cargo-deny/checks/sources/cfg.html
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
# 1 or more github.com organizations to allow git sources for
github = []
