name: "Sandbox policy"
# The shell-level half of the escape suite. These cannot live in cases/compat:
# the oracle there is bash, which has no namespace to disagree about.
#
# `--mount /work:.` mounts the harness's temp working directory, since a YAML
# file cannot know an absolute host path.
cases:
  - name: "A mounted tree is readable and writable"
    # `read` rather than `cat`: a restrictive policy has no external commands
    # in it, so the assertion has to be built from builtins and redirection.
    args:
      - "--mount"
      - "/work:."
      - "-c"
      - "echo hi > /work/f.txt; read -r line < /work/f.txt; echo \"$line\""
    expected_exit_code: 0
    expected_stdout: "hi\n"

  - name: "Supplying a mount makes everything else unnameable"
    # Not merely unreadable: /etc is not part of the namespace at all.
    args: ["--mount", "/work:.", "-c", "read -r line < /etc/passwd"]
    expected_exit_code: 1
    expected_stdout: ""
    ignore_stderr: true

  - name: "Dotdot cannot climb out of the namespace"
    args: ["--mount", "/work:.", "-c", "read -r line < /work/../etc/passwd"]
    expected_exit_code: 1
    expected_stdout: ""
    ignore_stderr: true

  - name: "Dotdot that stays inside still resolves"
    # The escape check must not be "reject ..", or ordinary navigation breaks.
    args:
      - "--mount"
      - "/work:."
      - "-c"
      - "echo deep > /work/f.txt; read -r line < /work/sub/../f.txt; echo \"$line\""
    expected_exit_code: 0
    expected_stdout: "deep\n"

  - name: "Climbing above the virtual root is refused"
    args: ["--mount", "/work:.", "-c", "read -r line < /.."]
    expected_exit_code: 1
    expected_stdout: ""
    ignore_stderr: true

  - name: "A read-only mount refuses writes"
    args: ["--mount", "/work:.:ro", "-c", "echo nope > /work/f.txt"]
    expected_exit_code: 1
    expected_stdout: ""
    ignore_stderr: true

  - name: "A read-only mount still allows reads"
    args:
      - "--mount"
      - "/work:.:ro"
      - "-c"
      - "read -r line < /work/seed.txt; echo \"$line\""
    expected_exit_code: 0
    expected_stdout: "seeded\n"
    test_files:
      - path: "seed.txt"
        contents: "seeded\n"

  - name: "Host path syntax is not virtual path syntax"
    # A drive letter is a colon, which the grammar forbids outright.
    args: ["--mount", "/work:.", "-c", "read -r line < /C:/Windows/win.ini"]
    expected_exit_code: 1
    expected_stdout: ""
    ignore_stderr: true

  - name: "Without --mount the shell is unconfined"
    # The identity policy, which is what keeps the compat suite running the
    # production binary. It proves the absence of regressions, not confinement.
    args: ["-c", "echo hi > f.txt && cat < f.txt"]
    expected_exit_code: 0
    expected_stdout: "hi\n"

  - name: "test predicates answer from the namespace, not the host"
    # Before this landed, -e/-d/-r consulted the host directly: a restrictive
    # policy leaked the host's existence map, and predicates were false for
    # files that were plainly present in a mount.
    args:
      - "--mount"
      - "/work:."
      - "-c"
      - "[[ -e /etc/passwd ]] && echo leak; [[ -d /etc ]] && echo leak; [ -r /etc/passwd ] && echo leak; echo done"
    expected_exit_code: 0
    expected_stdout: "done\n"

  - name: "test predicates see a mounted tree"
    args:
      - "--mount"
      - "/work:."
      - "-c"
      - "echo body > /work/f.txt; [[ -d /work && -e /work/f.txt && -f /work/f.txt && -r /work/f.txt && -s /work/f.txt ]] && echo yes"
    expected_exit_code: 0
    expected_stdout: "yes\n"

  - name: "A read-only mount reports -w false"
    args:
      - "--mount"
      - "/work:.:ro"
      - "-c"
      - "[[ -r /work/seed.txt ]] && echo readable; [[ -w /work/seed.txt ]] && echo writable; echo done"
    expected_exit_code: 0
    expected_stdout: "readable\ndone\n"
    test_files:
      - path: "seed.txt"
        contents: "seeded\n"

  - name: "-ef is false across the namespace boundary"
    args:
      - "--mount"
      - "/work:."
      - "-c"
      - "echo x > /work/f.txt; [[ /work/f.txt -ef /work/f.txt ]] && echo same; [[ /work/f.txt -ef /etc/passwd ]] && echo leak; echo done"
    expected_exit_code: 0
    expected_stdout: "same\ndone\n"

  - name: "The virtual root is not a directory"
    # A documented limit, not an oversight -- see D6. Every path in the
    # namespace is backed by a host object, and the root is not: it exists
    # because /work was mounted, and nothing on any host is it. Pinned here
    # because the failure is surprising enough that a future reader would
    # reasonably take it for a bug and "fix" it without reading D6.
    args: ["--mount", "/work:.", "-c", "[ -d / ] && echo yes || echo no"]
    expected_exit_code: 0
    expected_stdout: "no\n"

  - name: "cd cannot enter the virtual root"
    # Which is why `Shell::set_mounts` lands the shell at the shallowest mount
    # point rather than at `/`.
    args: ["--mount", "/work:.", "-c", "cd /"]
    expected_exit_code: 1
    expected_stdout: ""
    ignore_stderr: true

  - name: "cd navigates within the namespace"
    args:
      - "--mount"
      - "/work:."
      - "-c"
      - "cd /work && pwd; cd . && pwd; cd /work && pwd"
    expected_exit_code: 0
    expected_stdout: "/work\n/work\n/work\n"

  - name: "cd cannot leave the namespace"
    args: ["--mount", "/work:.", "-c", "cd /etc"]
    expected_exit_code: 1
    ignore_stderr: true

  - name: "cd cannot climb above the virtual root"
    args: ["--mount", "/work:.", "-c", "cd /work/../.."]
    expected_exit_code: 1
    ignore_stderr: true

  - name: "Command completion offers only what the namespace holds"
    # `compgen -c` walks every PATH directory itself rather than going through
    # command lookup, so it needs its own routing; before this landed it read
    # the host's directories and suggested host binaries that the shell could
    # not have run.
    args:
      - "--mount"
      - "/work:."
      - "-c"
      - "PATH=/work; compgen -c mytool; compgen -c notatool; echo done"
    expected_exit_code: 0
    expected_stdout: "mytool\ndone\n"
    test_files:
      - path: "mytool"
        contents: "#!/bin/sh\necho hi\n"
        executable: true
      - path: "notatool"
        contents: "not executable\n"

  - name: "Command completion does not leak the host's PATH"
    # The inherited PATH still names host directories; none of them are in the
    # namespace, so the correct answer is that they hold nothing.
    #
    # Only meaningful when `ls` is *not* compiled in: with the bundled
    # coreutils it is a shell builtin, and completion offering it is correct
    # rather than a leak.
    args: ["--mount", "/work:.", "-c", "compgen -c ls; echo done"]
    expected_exit_code: 0
    expected_stdout: "done\n"
    incompatible_platforms: ["bundled-coreutils"]

  - name: "The null device answers a confined shell"
    # No mount contains it, and none should have to: the handle is taken at
    # startup and held, so discarding output keeps working under any policy.
    args:
      - "--mount"
      - "/work:."
      - "-c"
      - "echo discarded > /dev/null; read -r line < /dev/null; echo \"[$line]\""
    expected_exit_code: 0
    expected_stdout: "[]\n"

  - name: "The descriptor table is reachable through /dev/fd"
    args:
      - "--mount"
      - "/work:.:ro"
      - "-c"
      - "exec 9< /work/seed.txt; read -r line < /dev/fd/9; echo \"$line\""
    expected_exit_code: 0
    expected_stdout: "seeded\n"
    test_files:
      - path: "seed.txt"
        contents: "seeded\n"

  - name: "An unopened /dev/fd entry is not found"
    # It used to fall through to the filesystem on a miss, which under the
    # identity policy handed back the *host* process's descriptor table.
    args: ["--mount", "/work:.", "-c", "read -r line < /dev/fd/7"]
    expected_exit_code: 1
    ignore_stderr: true

  - name: "A host binary is not executable through the namespace"
    # Routing executable *lookup* through the namespace without routing the
    # exec was a confused deputy: the namespace approved a virtual path and the
    # kernel then ran the host's file of the same spelling. Under a policy whose
    # layout echoes the host's, every command ran the host's version.
    args:
      - "--mount"
      - "/work:."
      - "-c"
      - "/bin/sh -c 'echo escaped'; echo \"rc=$?\""
    expected_exit_code: 0
    expected_stdout: "rc=127\n"
    ignore_stderr: true

  - name: "A relative host binary is not executable either"
    args:
      - "--mount"
      - "/work:."
      - "-c"
      - "cd /work; ../bin/sh; echo \"rc=$?\""
    expected_exit_code: 0
    expected_stdout: "rc=127\n"
    ignore_stderr: true

  - name: "hash -p cannot smuggle a host path past the namespace"
    # bash accepts a nonexistent path at `hash -p`, so the check is at the point
    # of execution rather than at the point of naming.
    args:
      - "--mount"
      - "/work:."
      - "-c"
      - "hash -p /bin/echo myecho; myecho leaked; echo \"rc=$?\""
    expected_exit_code: 0
    expected_stdout: "rc=127\n"
    ignore_stderr: true

  - name: "A confined shell lands somewhere it can name"
    # Installing a policy that does not contain the launcher's working directory
    # used to leave the shell holding a host path it could neither resolve
    # against nor hand to a child.
    args: ["--mount", "/work:.", "-c", "pwd; echo \"PWD=$PWD\""]
    expected_exit_code: 0
    expected_stdout: "/work\nPWD=/work\n"

  - name: "A bundled ls lists a named directory"
    # `ls <dir>` regressed to `ls: No such file or directory` while `cd <dir> &&
    # ls` and `ls <file>` both worked, because `uucore`'s `FileInformation`
    # -- the loop-detection identity `ls` takes for each directory argument
    # before it descends -- stats the path directly rather than through the
    # namespace. The bare message carries no path, which is what distinguishes
    # this failure from a mount that is genuinely absent.
    #
    # `--closed-world` because a bundled command is spawned by re-invoking the
    # launcher, whose host path is not inside the mount; the closed world is
    # what permits it. See `closed_world_tests.rs`.
    args: ["--mount", "/work:.", "--closed-world", "-c", "ls /work"]
    expected_exit_code: 0
    expected_stdout: "a.txt\nsub\n"
    incompatible_platforms: ["no-bundled-coreutils"]
    test_files:
      - path: "a.txt"
        contents: "x\n"
      - path: "sub/inner.txt"
        contents: "y\n"

  - name: "A bundled ls descends into a named directory"
    # The recursive form takes the same identity per directory it enters, so it
    # pins the failure one level deeper than the case above.
    args: ["--mount", "/work:.", "--closed-world", "-c", "ls -R /work"]
    expected_exit_code: 0
    expected_stdout: "/work:\na.txt\nsub\n\n/work/sub:\ninner.txt\n"
    incompatible_platforms: ["no-bundled-coreutils"]
    test_files:
      - path: "a.txt"
        contents: "x\n"
      - path: "sub/inner.txt"
        contents: "y\n"

  - name: "A bundled ls dereferences from the namespace, not the host"
    # `-L` puts every entry on the dereferencing branch of
    # `get_metadata_with_deref_opt`, which was `Path::metadata` -- an inherent
    # method the codemod cannot see, so it asked the host and every entry
    # failed with `cannot access`.
    args: ["--mount", "/work:.", "--closed-world", "-c", "ls -L /work"]
    expected_exit_code: 0
    expected_stdout: "a.txt\nsub\n"
    incompatible_platforms: ["no-bundled-coreutils"]
    test_files:
      - path: "a.txt"
        contents: "x\n"
      - path: "sub/inner.txt"
        contents: "y\n"
