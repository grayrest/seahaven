name: "Pipeline"
cases:
  - name: "Basic pipe"
    stdin: |
      echo hi | grep -l h

  - name: "Longer pipe"
    stdin: |
      echo hi | grep h | wc -l

  - name: "Invert result"
    stdin: |
      ! false
      echo "! false: $?"
      ! true
      echo "! true: $?"

  - name: "Standalone negation (no command)"
    stdin: |
      !
      echo "After !: $?"
      ! !
      echo "After ! !: $?"

  - name: "Exit codes for piped commands"
    test_files:
      - path: "script.sh"
        executable: true
        contents: |
          #!/bin/sh
          (cat; echo -n "-> $1")
          exit $1
    stdin: |
      ./script.sh 10 | ./script.sh 0 | ./script.sh 33

  - name: "Side effects in pipe commands"
    stdin: |
      var=0
      echo "var: ${var}"
      { var=1; }
      echo "var: ${var}"
      { var=2; echo hi; } | cat
      echo "var: ${var}"
      echo hi | { var=3; cat; }
      echo "var: ${var}"

  - name: "pipeline extension"
    stdin: |
      echo -e "hello" |& wc -l
      cat dfdfgdfgdf |& wc -l
      foo() { cat dfgdfg; } |& wc -l

  - name: "Possible broken pipe case"
    stdin: |
      echo hello | var=value

  - name: "printf broken pipe returns 141 in PIPESTATUS"
    # The range has to put the payload past *any* pipe buffer, or the case has
    # two legal outcomes and picks one by scheduling. `{0..10000}` is 48,896
    # bytes, which fits a 64KiB pipe whole: if `x=1` has not exited yet when
    # `printf` writes, the write completes and `printf` exits 0, and the case
    # fails with `PIPESTATUS: 0 0` -- which it did, once, in a loaded
    # `cargo test --workspace` and never in isolation. Measured with the reader
    # held open: at 48,896 bytes `printf` exits 0, at 108,896 it exits 141.
    #
    # `{0..20000}` is 108,896 bytes, so `printf` cannot finish whatever the
    # reader does: it blocks with the pipe full and is still blocked when the
    # reader exits. SIGPIPE is then the only outcome, by construction rather
    # than by timing.
    stdin: |
      printf '%s\n' {0..20000} | x=1
      echo "Last: $?, PIPESTATUS: ${PIPESTATUS[*]}"
