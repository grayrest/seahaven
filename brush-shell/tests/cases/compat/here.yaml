name: "Here docs/strings"
cases:
  - name: "Basic here doc"
    stdin: |
      cat <<END-MARKER
      Something here...
      ...and here.
      END-MARKER
      echo "This is after"

  - name: "Basic here doc in a script"
    test_files:
      - path: "script.sh"
        contents: |
          cat <<END-MARKER
          Something here...
          ...and here.
          END-MARKER
          echo "This is after"
    args: ["./script.sh"]

  - name: "Here doc in a function"
    stdin: |
      function myfunc() {
        if true
        then
          cat << END-MARKER
      Something here...
      END-MARKER
        fi
      }

      myfunc

  - name: "Here doc with expansions"
    stdin: |
      cat <<END-MARKER
      Something here...
      ...and here.
      $(echo "This is after")
      END-MARKER

  - name: "Here doc with expansions but quoted tag"
    stdin: |
      cat <<"END-MARKER"
      Something here...
      ...and here.
      $(echo "This is after")
      END-MARKER

  - name: "Here doc with tab removal"
    stdin: |
      cat <<-END-MARKER
      	Something here...
      	...and here.
      	END-MARKER

  - name: "Basic here string"
    stdin: |
      shopt -ou posix
      cat <<<"Something here."
      wc -l <<<"Something"

  - name: "Empty here doc"
    stdin: |
      wc -l <<EOF
      EOF

  - name: "Basic here doc"
    stdin: "wc -l <<EOF\nSomething\nEOF"

  - name: "Here doc with other tokens after tag"
    stdin: |
      wc -l <<EOF | wc -l
      A B C
      1 2 3
      EOF

  - name: "Multiple here docs"
    stdin: |
      cat <<EOF1 <<EOF2
      A B C
      EOF1
      1 2 3
      EOF2

  - name: "Here doc in a command substitution"
    stdin: |
      test1=$(cat <<EOF
      1
      2 3
      4 5 6
      EOF
      )

      echo "${test1}"

  - name: "Here doc in a double-quoted command substitution"
    stdin: |
      test1="$(cat <<EOF
      something
      EOF
      )"

      echo "${test1}"

  - name: "Here doc in a double-quoted command substitution with spaces"
    stdin: |
      test1="$(cat << EOF
      something
      EOF
      )"

      echo "${test1}"

  - name: "Here doc in a command substitution with quotes"
    stdin: |
      test1=$(cat <<EOF
      something "quoted"
      EOF
      )

      echo "${test1}"

  - name: "Here doc with parameter default containing quotes"
    stdin: |
      cat <<EOF
      ${unset_var:-"default value"}
      EOF

  - name: "Here doc preserves literal double quotes"
    stdin: |
      cat <<EOF
      "double quoted"
      she said "hello"
      EOF

  - name: "Here doc preserves literal single quotes"
    stdin: |
      cat <<EOF
      'single quoted'
      it's a test
      EOF

  - name: "Here doc with mixed quotes and expansion"
    stdin: |
      x=world
      cat <<EOF
      "hello $x"
      "$x" and more
      EOF

  - name: "Here doc does not perform brace expansion"
    stdin: |
      cat <<EOF
      {a,b,c}
      {1..3}
      EOF

  - name: "Here doc does not perform tilde expansion"
    stdin: |
      cat <<EOF
      ~
      ~/path
      EOF

  - name: "Here doc escape sequences"
    stdin: |
      cat <<EOF
      \$HOME
      \\backslash
      \n not a newline
      \"not unquoted\"
      \'not unquoted\'
      EOF

  - name: "Here doc with command substitution containing quotes"
    stdin: |
      cat <<EOF
      $(echo "hello world")
      $(echo 'single')
      EOF

  - name: "Here doc with arithmetic expansion"
    stdin: |
      cat <<EOF
      $((2 + 3))
      $((10 * 2))
      EOF

  - name: "Here doc in a command substitution with parentheses"
    stdin: |
      test1=$(cat <<EOF
      (something)
      EOF
      )

      echo "${test1}"

  - name: "Here doc with parentheses"
    stdin: |
      cat <<EOF
      (something)
      EOF

  - name: "Multiple here docs in a command substitution"
    stdin: |
      test1=$(cat <<EOF1 <<EOF2
      A B C
      EOF1
      D E F
      EOF2
      )

      echo "${test1}"

  - name: "Complex here docs in a command substitution"
    stdin: |
      test1=$(cat <<EOF1 <<EOF2 | wc -l
      A B C
      EOF1
      D E F
      EOF2
      )

      echo "${test1}"

  - name: "Here doc with quoted delimiter"
    stdin: |
      cat <<'EOF'
      something
      EOF

  - name: "Here doc with double quoted delimiter"
    stdin: |
      cat <<"EOF"
      something
      EOF

  - name: "Here doc with quoted delimiter inside command substitution"
    stdin: |
      $(cat <<'EOF'
      true
      EOF
      )

  - name: "Here doc with double quoted delimiter inside command substitution"
    stdin: |
      $(cat <<"EOF"
      true
      EOF
      )

  - name: "Here doc with unpaired single quote in command substitution"
    stdin: |
      echo "$(cat <<'EOF'
      it's here
      EOF
      )"

  - name: "Here doc with unpaired backtick in command substitution"
    stdin: |
      echo "$(cat <<'EOF'
      a ` b
      EOF
      )"

  - name: "Here doc with three single quotes in command substitution"
    stdin: |
      echo "$(cat <<'EOF'
      it's Bob's it's
      EOF
      )"

  - name: "Here doc with unpaired single quote in command substitution (#420)"
    stdin: |
      var=$(
        sed 's/nice/cool/' - <<-EOF
        that's
        "nice"
      EOF
      )
      echo $var

  - name: "Here doc larger than the pipe buffer"
    # Pipe capacity is 16 KiB on macOS and 64 KiB on Linux, so a body past that
    # cannot be written into an unread pipe without blocking. Sized past 1 MiB
    # deliberately: Linux could previously grow the pipe with F_SETPIPE_SZ up to
    # pipe-max-size (1 MiB by default), so a smaller body passes there and the
    # primary CI lane would guard nothing.
    stdin: |
      body=$(yes 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa' | head -16384)
      out=$(cat <<EOF
      $body
      EOF
      )
      echo "${#out}"

  - name: "Here string larger than the pipe buffer"
    stdin: |
      body=$(yes 'bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb' | head -2048)
      out=$(cat <<<"$body")
      echo "${#out}"

  - name: "Here doc survives exec replacing the process image"
    # A pipe's write end is O_CLOEXEC, so anything still unwritten when the
    # process image is replaced is lost and the reader sees a short, silent EOF.
    incompatible_configs: ["sh"]
    # stderr is ignored: `exec` with an injected fd panics a tokio I/O worker
    # ("Bad file descriptor") on every invocation, including a 6-byte here-doc
    # on unpatched code. That is a separate pre-existing bug; this case asserts
    # only that the payload arrives intact.
    ignore_stderr: true
    stdin: |
      body=$(yes 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa' | head -8192)
      exec 3<<EOF
      $body
      EOF
      exec /bin/sh -c "wc -c <&3"

  - name: "read -t 0 sees a here string larger than PIPE_BUF"
    # Here-document contents must be readable the instant the descriptor is
    # installed; `read -t 0` reports availability with no wait. An asynchronous
    # writer cannot promise that, and the failure is load-dependent, so pin it
    # above any plausible inline-write bound.
    stdin: |
      body=$(yes 'x' | head -601 | tr -d '\n')
      read -t 0 <<< "$body"; echo "available: $?"
