# The Roc platform host. Excluded from the workspace like `forks/`: it is a
# `staticlib` linked by `roc`, not by cargo, and its generated glue is
# unsafe-heavy `extern "C"` code that the workspace lint wall (missing_docs,
# undocumented_unsafe_blocks, ...) is not written for. It path-depends on the
# workspace crates it routes through.
[workspace]

[package]
name = "brush-roc-host"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "host"
crate-type = ["staticlib"]

[features]
# The broker-backed executor (D24) and the bundled-dispatch trampoline (D30),
# pulling the launcher + coreutils into the linked binary. On by default -- it
# is the real artifact -- but separable: linking it needs several GB of memory
# (the whole shell), so a memory-constrained machine can build the effect
# surface without it (`--no-default-features`) and `Cmd` is `Unsupported`, which
# the executor's own end-to-end tests already cover.
default = ["broker-executor"]
broker-executor = ["dep:brush-broker-exec", "dep:brush-shell"]
# The broker-less alternative (see `src/shell_exec.rs`): delegates to an external
# `brush` binary named by `SEAHAVEN_BRUSH`. Std-only -- no `brush-core`, so no
# `chrono` -> CoreFoundation, which the roc toolchain cannot link. Used to run
# rocjust's harness where the embedded executor will not link.
shell-executor = []

[dependencies]
brush-platform = { path = "../brush-platform" }
brush-vfs = { path = "../brush-vfs" }
brush-broker-exec = { path = "../brush-broker-exec", optional = true }
# The launcher, for its two trampoline halves: `bundled::install_default_providers`
# + `maybe_dispatch` (this binary dispatches its own bundled utilities, D30), and
# `bundled::DISPATCH_FLAG` (the executor re-invokes through it). The coreutils
# registry, without the reedline/interactive UI the host does not use.
brush-shell = { path = "../brush-shell", default-features = false, features = [
    "experimental-bundled-coreutils",
], optional = true }
libc = "0.2"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = true
# Exported hosted_* and roc_* symbols must survive; do not strip them.
strip = "debuginfo"
panic = "abort"
