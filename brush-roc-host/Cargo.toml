# The Roc platform host. Excluded from the workspace like `forks/`: it is a
# `staticlib` linked by `roc`, not by cargo, and its generated glue is
# unsafe-heavy `extern "C"` code that the workspace lint wall (missing_docs,
# undocumented_unsafe_blocks, ...) is not written for. It path-depends on the
# workspace crates it routes through.
[workspace]

[package]
name = "brush-roc-host"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "host"
crate-type = ["staticlib"]

[dependencies]
brush-platform = { path = "../brush-platform" }
brush-vfs = { path = "../brush-vfs" }
brush-broker-exec = { path = "../brush-broker-exec" }
# The launcher, for its two trampoline halves: `bundled::install_default_providers`
# + `maybe_dispatch` (this binary dispatches its own bundled utilities, D30), and
# `bundled::DISPATCH_FLAG` (the executor re-invokes through it). Default features
# off -- the host is not interactive, so it wants the coreutils registry and none
# of the reedline/interactive UI.
brush-shell = { path = "../brush-shell", default-features = false, features = [
    "experimental-bundled-coreutils",
] }
libc = "0.2"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = true
# Exported hosted_* and roc_* symbols must survive; do not strip them.
strip = "debuginfo"
panic = "abort"
