# Fork of uu_mv, vendored from crates.io by `cargo xtask vendor-fork`.
#
# Generated, not maintained (D13): pristine upstream is the baseline and the
# filesystem-routing diff is applied by the codemod. Not a workspace member
# (see the root `[workspace] exclude`); its routing is proven by the Landlock
# test (D41), not the ban (D3).

[dependencies.brush-vfs]
path = "../../brush-vfs"

[dependencies.clap]
features = [
    "wrap_help",
    "cargo",
    "color",
]
version = "4.5"

[dependencies.fluent]
version = "0.17.0"

[dependencies.fs_extra]
version = "1.3.0"

[dependencies.indicatif]
version = "0.18.0"

[dependencies.libc]
version = "0.2.186"

[dependencies.nix]
default-features = false
version = "0.31.3"

[dependencies.rustc-hash]
version = "2.1.1"

[dependencies.thiserror]
version = "2.0.3"

[dependencies.uucore]
features = [
    "backup-control",
    "buf-copy",
    "fs",
    "fsxattr",
    "perms",
    "safe-copy",
    "update-control",
]
version = "0.10.0"

[dev-dependencies.ctor]
version = "0.8"

[dev-dependencies.divan]
package = "codspeed-divan-compat"
version = "5.0.0"

[dev-dependencies.tempfile]
version = "3.15.0"

[dev-dependencies.uucore]
features = ["benchmark"]
version = "0.10.0"

[features]
selinux = ["uucore/selinux"]

[lib]
doctest = false
name = "uu_mv"
path = "src/mv.rs"

[package]
autobenches = false
autobins = false
autoexamples = false
autolib = false
autotests = false
build = false
categories = ["command-line-utilities"]
description = "mv ~ (uutils) move (rename) SOURCE to DESTINATION"
edition = "2024"
homepage = "https://github.com/uutils/coreutils"
keywords = [
    "coreutils",
    "uutils",
    "cross-platform",
    "cli",
    "utility",
]
license = "MIT"
name = "uu_mv"
repository = "https://github.com/uutils/coreutils/tree/main/src/uu/mv"
rust-version = "1.88.0"
version = "0.10.0"

[target."cfg(unix)".dependencies.libc]
version = "0.2.186"

[target."cfg(unix)".dependencies.rustix]
features = [
    "param",
    "use-libc-auxv",
    "time",
    "fs",
]
version = "1.1.4"

[target."cfg(windows)".dependencies.windows-sys]
default-features = false
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
]
version = "0.61.0"
