# Fork of uu_tail, vendored from crates.io by `cargo xtask vendor-fork`.
#
# Generated, not maintained (D13): pristine upstream is the baseline and the
# filesystem-routing diff is applied by the codemod. Not a workspace member
# (see the root `[workspace] exclude`); its routing is proven by the Landlock
# test (D41), not the ban (D3).

[dependencies.brush-vfs]
path = "../../brush-vfs"

[dependencies.clap]
features = [
    "wrap_help",
    "cargo",
    "color",
]
version = "4.5"

[dependencies.fluent]
version = "0.17.0"

[dependencies.memchr]
version = "2.7.2"

[dependencies.same-file]
version = "1.0.6"

[dependencies.uucore]
features = [
    "fs",
    "parser-size",
    "signals",
]
version = "0.10.0"

[dev-dependencies.ctor]
version = "0.8"

[dev-dependencies.rstest]
version = "0.26.0"

[lib]
doctest = false
name = "uu_tail"
path = "src/tail.rs"

[package]
autobenches = false
autobins = false
autoexamples = false
autolib = false
autotests = false
build = false
categories = ["command-line-utilities"]
description = "tail ~ (uutils) display the last lines of input"
edition = "2024"
homepage = "https://github.com/uutils/coreutils"
keywords = [
    "coreutils",
    "uutils",
    "cross-platform",
    "cli",
    "utility",
]
license = "MIT"
name = "uu_tail"
repository = "https://github.com/uutils/coreutils/tree/main/src/uu/tail"
rust-version = "1.88.0"
version = "0.10.0"

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies.uucore]
features = ["pipes"]
version = "0.10.0"

[target.'cfg(not(target_os = "wasi"))'.dependencies.libc]
version = "0.2.186"

[target."cfg(unix)".dependencies.rustix]
features = [
    "param",
    "use-libc-auxv",
    "time",
    "fs",
    "process",
]
version = "1.1.4"

[target."cfg(windows)".dependencies.windows-sys]
default-features = false
features = [
    "Win32_System_Threading",
    "Win32_Foundation",
]
version = "0.61.0"
