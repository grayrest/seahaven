# Fork of uu_ls, vendored from crates.io by `cargo xtask vendor-fork`.
#
# Generated, not maintained (D13): pristine upstream is the baseline and the
# filesystem-routing diff is applied by the codemod. Not a workspace member
# (see the root `[workspace] exclude`); its routing is proven by the Landlock
# test (D41), not the ban (D3).

[dependencies.ansi-width]
version = "0.1.0"

[dependencies.brush-vfs]
path = "../../brush-vfs"

[dependencies.clap]
features = [
    "wrap_help",
    "cargo",
    "color",
    "env",
]
version = "4.5"

[dependencies.fluent]
version = "0.17.0"

[dependencies.glob]
version = "0.3.1"

[dependencies.lscolors]
default-features = false
features = ["gnu_legacy"]
version = "0.21.0"

[dependencies.rustc-hash]
version = "2.1.1"

[dependencies.terminal_size]
version = "0.4.0"

[dependencies.thiserror]
version = "2.0.3"

[dependencies.uucore]
features = [
    "colors",
    "entries",
    "format",
    "fs",
    "fsext",
    "fsxattr",
    "parser-size",
    "parser-glob",
    "quoting-style",
    "time",
    "version-cmp",
]
version = "0.10.0"

[dependencies.uutils_term_grid]
version = "0.8"

[dev-dependencies.ctor]
version = "0.8"

[dev-dependencies.divan]
package = "codspeed-divan-compat"
version = "5.0.0"

[dev-dependencies.tempfile]
version = "3.15.0"

[dev-dependencies.uucore]
features = ["benchmark"]
version = "0.10.0"

[features]
feat_selinux = [
    "selinux",
    "uucore/selinux",
]
smack = ["uucore/smack"]

[lib]
doctest = false
name = "uu_ls"
path = "src/ls.rs"

[package]
autobenches = false
autobins = false
autoexamples = false
autolib = false
autotests = false
build = false
categories = ["command-line-utilities"]
description = "ls ~ (uutils) display directory contents"
edition = "2024"
homepage = "https://github.com/uutils/coreutils"
keywords = [
    "coreutils",
    "uutils",
    "cross-platform",
    "cli",
    "utility",
]
license = "MIT"
name = "uu_ls"
repository = "https://github.com/uutils/coreutils/tree/main/src/uu/ls"
rust-version = "1.88.0"
version = "0.10.0"

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies.selinux]
optional = true
version = "0.6"

[target.'cfg(not(target_os = "wasi"))'.dependencies.hostname]
version = "0.4"
