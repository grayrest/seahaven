# Fork of uu_more, vendored from crates.io by `cargo xtask vendor-fork`.
#
# Generated, not maintained (D13): pristine upstream is the baseline and the
# filesystem-routing diff is applied by the codemod. Not a workspace member
# (see the root `[workspace] exclude`); its routing is proven by the Landlock
# test (D41), not the ban (D3).

[dependencies.brush-vfs]
path = "../../brush-vfs"

[dependencies.clap]
features = [
    "wrap_help",
    "cargo",
    "color",
]
version = "4.5"

[dependencies.crossterm]
default-features = false
features = ["events"]
version = "0.29.0"

[dependencies.fluent]
version = "0.17.0"

[dependencies.uucore]
version = "0.10.0"

[dev-dependencies.ctor]
version = "0.8"

[dev-dependencies.tempfile]
version = "3.15.0"

[lib]
doctest = false
name = "uu_more"
path = "src/more.rs"

[package]
autobenches = false
autobins = false
autoexamples = false
autolib = false
autotests = false
build = false
categories = ["command-line-utilities"]
description = "more ~ (uutils) input perusal filter"
edition = "2024"
homepage = "https://github.com/uutils/coreutils"
keywords = [
    "coreutils",
    "uutils",
    "cross-platform",
    "cli",
    "utility",
]
license = "MIT"
name = "uu_more"
repository = "https://github.com/uutils/coreutils/tree/main/src/uu/more"
rust-version = "1.88.0"
version = "0.10.0"

[target.'cfg(target_os = "macos")'.dependencies.crossterm]
default-features = false
features = ["use-dev-tty"]
version = "0.29.0"

[target."cfg(windows)".dependencies.crossterm]
default-features = false
features = ["windows"]
version = "0.29.0"
