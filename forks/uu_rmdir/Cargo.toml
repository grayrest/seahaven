# Fork of uu_rmdir, vendored from crates.io by `cargo xtask vendor-fork`.
#
# Generated, not maintained (D13): pristine upstream is the baseline and the
# filesystem-routing diff is applied by the codemod. Not a workspace member
# (see the root `[workspace] exclude`); its routing is proven by the Landlock
# test (D41), not the ban (D3).

[dependencies.brush-vfs]
path = "../../brush-vfs"

[dependencies.clap]
features = [
    "wrap_help",
    "cargo",
    "color",
]
version = "4.5"

[dependencies.fluent]
version = "0.17.0"

[dependencies.libc]
version = "0.2.186"

[dependencies.uucore]
features = ["fs"]
version = "0.10.0"

[dev-dependencies.ctor]
version = "0.8"

[lib]
doctest = false
name = "uu_rmdir"
path = "src/rmdir.rs"
test = false

[package]
autobenches = false
autobins = false
autoexamples = false
autolib = false
autotests = false
build = false
categories = ["command-line-utilities"]
description = "rmdir ~ (uutils) remove empty DIRECTORY"
edition = "2024"
homepage = "https://github.com/uutils/coreutils"
keywords = [
    "coreutils",
    "uutils",
    "cross-platform",
    "cli",
    "utility",
]
license = "MIT"
name = "uu_rmdir"
repository = "https://github.com/uutils/coreutils/tree/main/src/uu/rmdir"
rust-version = "1.88.0"
version = "0.10.0"
