# Fork of uu_tac, vendored from crates.io by `cargo xtask vendor-fork`.
#
# Generated, not maintained (D13): pristine upstream is the baseline and the
# filesystem-routing diff is applied by the codemod. Not a workspace member
# (see the root `[workspace] exclude`); its routing is proven by the Landlock
# test (D41), not the ban (D3).

[dependencies.brush-vfs]
path = "../../brush-vfs"

[dependencies.clap]
features = [
    "wrap_help",
    "cargo",
    "color",
]
version = "4.5"

[dependencies.fluent]
version = "0.17.0"

[dependencies.libc]
version = "0.2.186"

[dependencies.memchr]
version = "2.7.2"

[dependencies.memmap2]
version = "0.9.4"

[dependencies.regex]
version = "1.10.4"

[dependencies.tempfile]
version = "3.15.0"

[dependencies.thiserror]
version = "2.0.3"

[dependencies.uucore]
features = ["signals"]
version = "0.10.0"

[lib]
doctest = false
name = "uu_tac"
path = "src/tac.rs"

[package]
autobenches = false
autobins = false
autoexamples = false
autolib = false
autotests = false
build = false
categories = ["command-line-utilities"]
description = "tac ~ (uutils) concatenate and display input lines in reverse order"
edition = "2024"
homepage = "https://github.com/uutils/coreutils"
keywords = [
    "coreutils",
    "uutils",
    "cross-platform",
    "cli",
    "utility",
]
license = "MIT"
name = "uu_tac"
repository = "https://github.com/uutils/coreutils/tree/main/src/uu/tac"
rust-version = "1.88.0"
version = "0.10.0"
