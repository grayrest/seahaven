# Fork of uu_wc, vendored from crates.io by `cargo xtask vendor-fork`.
#
# Generated, not maintained (D13): pristine upstream is the baseline and the
# filesystem-routing diff is applied by the codemod. Not a workspace member
# (see the root `[workspace] exclude`); its routing is proven by the Landlock
# test (D41), not the ban (D3).

[dependencies.brush-vfs]
path = "../../brush-vfs"

[dependencies.bytecount]
features = ["runtime-dispatch-simd"]
version = "0.6.8"

[dependencies.clap]
features = [
    "wrap_help",
    "cargo",
    "color",
]
version = "4.5"

[dependencies.fluent]
version = "0.17.0"

[dependencies.thiserror]
version = "2.0.3"

[dependencies.unicode-width]
version = "0.2.0"

[dependencies.uucore]
features = [
    "hardware",
    "parser",
    "pipes",
    "quoting-style",
]
version = "0.10.0"

[dev-dependencies.ctor]
version = "0.8"

[dev-dependencies.divan]
package = "codspeed-divan-compat"
version = "5.0.0"

[dev-dependencies.tempfile]
version = "3.15.0"

[dev-dependencies.uucore]
features = ["benchmark"]
version = "0.10.0"

[lib]
doctest = false
name = "uu_wc"
path = "src/wc.rs"

[package]
autobenches = false
autobins = false
autoexamples = false
autolib = false
autotests = false
build = false
categories = ["command-line-utilities"]
description = "wc ~ (uutils) display newline, word, and byte counts for input"
edition = "2024"
homepage = "https://github.com/uutils/coreutils"
keywords = [
    "coreutils",
    "uutils",
    "cross-platform",
    "cli",
    "utility",
]
license = "MIT"
name = "uu_wc"
repository = "https://github.com/uutils/coreutils/tree/main/src/uu/wc"
rust-version = "1.88.0"
version = "0.10.0"

[target."cfg(unix)".dependencies.libc]
version = "0.2.186"

[target."cfg(unix)".dependencies.rustix]
features = [
    "param",
    "use-libc-auxv",
    "time",
    "fs",
]
version = "1.1.4"
