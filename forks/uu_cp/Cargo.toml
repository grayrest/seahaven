# Fork of uu_cp, vendored from crates.io by `cargo xtask vendor-fork`.
#
# Generated, not maintained (D13): pristine upstream is the baseline and the
# filesystem-routing diff is applied by the codemod. Not a workspace member
# (see the root `[workspace] exclude`); its routing is proven by the Landlock
# test (D41), not the ban (D3).

[dependencies.brush-vfs]
path = "../../brush-vfs"

[dependencies.clap]
features = [
    "wrap_help",
    "cargo",
    "color",
]
version = "4.5"

[dependencies.filetime]
version = "0.2.29"

[dependencies.fluent]
version = "0.17.0"

[dependencies.indicatif]
version = "0.18.0"

[dependencies.libc]
version = "0.2.186"

[dependencies.rustix]
features = [
    "param",
    "use-libc-auxv",
    "time",
]
version = "1.1.4"

[dependencies.thiserror]
version = "2.0.3"

[dependencies.uucore]
features = [
    "backup-control",
    "buf-copy",
    "entries",
    "fs",
    "fsxattr",
    "parser",
    "perms",
    "mode",
    "safe-copy",
    "update-control",
]
version = "0.10.0"

[dev-dependencies.ctor]
version = "0.8"

[dev-dependencies.divan]
package = "codspeed-divan-compat"
version = "5.0.0"

[dev-dependencies.tempfile]
version = "3.15.0"

[dev-dependencies.uucore]
features = ["benchmark"]
version = "0.10.0"

[features]
feat_selinux = [
    "selinux",
    "uucore/selinux",
]

[lib]
doctest = false
name = "uu_cp"
path = "src/cp.rs"

[package]
autobenches = false
autobins = false
autoexamples = false
autolib = false
autotests = false
build = false
categories = ["command-line-utilities"]
description = "cp ~ (uutils) copy SOURCE to DESTINATION"
edition = "2024"
homepage = "https://github.com/uutils/coreutils"
keywords = [
    "coreutils",
    "uutils",
    "cross-platform",
    "cli",
    "utility",
]
license = "MIT"
name = "uu_cp"
repository = "https://github.com/uutils/coreutils/tree/main/src/uu/cp"
rust-version = "1.88.0"
version = "0.10.0"

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies.selinux]
optional = true
version = "0.6"

[target.'cfg(target_os = "windows")'.dependencies.windows-sys]
default-features = false
features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
]
version = "0.61.0"

[target."cfg(unix)".dependencies.nix]
default-features = false
features = ["fs"]
version = "0.31.3"
