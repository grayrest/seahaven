# Fork of uu_cat 0.10.0, vendored from crates.io.
#
# Generated, not maintained (D13): the pristine upstream source is committed as
# a baseline, and the filesystem-routing transformation is applied by
# `cargo xtask codemod` in a separate commit so its diff is auditable. Re-vendor
# by copying a newer upstream and re-running the codemod; the residual diff is
# the health metric.
#
# Not a workspace member (see the root `[workspace] exclude`): upstream code does
# not pass brush's pedantic lints, and the filesystem ban must not see it -- its
# routing is proven by the Landlock completeness test (D41), not the lint (D3).
[package]
name = "uu_cat"
version = "0.10.0"
edition = "2024"
rust-version = "1.88.0"
description = "cat ~ (uutils) concatenate and display input (brush fork)"
homepage = "https://github.com/uutils/coreutils"
license = "MIT"
repository = "https://github.com/uutils/coreutils/tree/main/src/uu/cat"
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false

[lib]
name = "uu_cat"
path = "src/cat.rs"
doctest = false

[dependencies]
brush-vfs = { path = "../../brush-vfs" }
clap = { version = "4.5", features = ["wrap_help", "cargo", "color"] }
fluent = "0.17.0"
memchr = "2.7.2"
rustix = { version = "1.1.4", features = ["param", "use-libc-auxv", "time", "fs"] }
thiserror = "2.0.3"
uucore = { version = "0.10.0", features = ["fast-inc", "fs", "pipes", "signals"] }

[target."cfg(windows)".dependencies]
winapi-util = "0.1.8"
windows-sys = { version = "0.61.0", features = ["Win32_Storage_FileSystem"], default-features = false }

[dev-dependencies]
tempfile = "3.15.0"
