version = "0.1.8"

[target.'cfg(target_os = "windows")'.dependencies.windows-sys]
default-features = false
features = [
    "Wdk_System_SystemInformation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_IO",
