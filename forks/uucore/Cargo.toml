[lib]
name = "uucore"
path = "src/lib/lib.rs"

[package]
autobenches = false
autobins = false
autoexamples = false
autolib = false
autotests = false
build = "build.rs"
categories = ["command-line-utilities"]
description = "uutils ~ 'core' uutils code library (cross-platform)"
edition = "2024"
homepage = "https://github.com/uutils/coreutils"
keywords = [
    "coreutils",
    "uutils",
    "cross-platform",
    "cli",
    "utility",
]
license = "MIT"
name = "uucore"
repository = "https://github.com/uutils/coreutils/tree/main/src/uucore"
rust-version = "1.88.0"
version = "0.10.0"

[package.metadata.docs.rs]
all-features = true

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies.selinux]
optional = true
version = "0.6"

[target.'cfg(target_os = "linux")'.dependencies.procfs]
optional = true
version = "0.18"

[target.'cfg(target_os = "openbsd")'.dependencies.utmp-classic]
