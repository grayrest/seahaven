# Fork of uu_od, vendored from crates.io by `cargo xtask vendor-fork`.
#
# Generated, not maintained (D13): pristine upstream is the baseline and the
# filesystem-routing diff is applied by the codemod. Not a workspace member
# (see the root `[workspace] exclude`); its routing is proven by the Landlock
# test (D41), not the ban (D3).

[dependencies.brush-vfs]
path = "../../brush-vfs"

[dependencies.byteorder]
version = "1.5.0"

[dependencies.clap]
features = [
    "wrap_help",
    "cargo",
    "color",
]
version = "4.5"

[dependencies.fluent]
version = "0.17.0"

[dependencies.half]
version = "2.4.1"

[dependencies.libc]
version = "0.2.186"

[dependencies.rustix]
features = [
    "param",
    "use-libc-auxv",
    "time",
    "stdio",
]
version = "1.1.4"

[dependencies.uucore]
features = [
    "fs",
    "parser-size",
]
version = "0.10.0"

[dev-dependencies.ctor]
version = "0.8"

[dev-dependencies.tempfile]
version = "3.15.0"

[lib]
name = "uu_od"
path = "src/od.rs"

[package]
autobenches = false
autobins = false
autoexamples = false
autolib = false
autotests = false
build = false
categories = ["command-line-utilities"]
description = "od ~ (uutils) display formatted representation of input"
edition = "2024"
homepage = "https://github.com/uutils/coreutils"
keywords = [
    "coreutils",
    "uutils",
    "cross-platform",
    "cli",
    "utility",
]
license = "MIT"
name = "uu_od"
repository = "https://github.com/uutils/coreutils/tree/main/src/uu/od"
rust-version = "1.88.0"
version = "0.10.0"
