# Fork of uu_head, vendored from crates.io by `cargo xtask vendor-fork`.
#
# Generated, not maintained (D13): pristine upstream is the baseline and the
# filesystem-routing diff is applied by the codemod. Not a workspace member
# (see the root `[workspace] exclude`); its routing is proven by the Landlock
# test (D41), not the ban (D3).

[dependencies.brush-vfs]
path = "../../brush-vfs"

[dependencies.clap]
features = [
    "wrap_help",
    "cargo",
    "color",
]
version = "4.5"

[dependencies.fluent]
version = "0.17.0"

[dependencies.memchr]
version = "2.7.2"

[dependencies.thiserror]
version = "2.0.3"

[dependencies.uucore]
features = [
    "parser-size",
    "pipes",
    "ringbuffer",
    "lines",
    "fs",
]
version = "0.10.0"

[lib]
doctest = false
name = "uu_head"
path = "src/head.rs"

[package]
autobenches = false
autobins = false
autoexamples = false
autolib = false
autotests = false
build = false
categories = ["command-line-utilities"]
description = "head ~ (uutils) display the first lines of input"
edition = "2024"
homepage = "https://github.com/uutils/coreutils"
keywords = [
    "coreutils",
    "uutils",
    "cross-platform",
    "cli",
    "utility",
]
license = "MIT"
name = "uu_head"
repository = "https://github.com/uutils/coreutils/tree/main/src/uu/head"
rust-version = "1.88.0"
version = "0.10.0"
