[workspace]
resolver = "3"
members = [
    "brush",
    "brush-shell",
    "brush-parser",
    "brush-core",
    "brush-vfs",
    "brush-platform",
    "brush-builtins",
    "brush-coreutils-builtins",
    "brush-experimental-builtins",
    "brush-interactive",
    "brush-test-harness",
    "fuzz",
    "xtask",
]
# The coreutils forks are dependencies, not members: upstream code does not pass
# brush's pedantic lints, and the filesystem ban (which runs `--workspace`) must
# not see them -- their routing is proven by the Landlock test (D41), not the
# lint (D3). This mirrors how the crates.io versions they replace were never
# linted either.
exclude = ["forks"]
default-members = ["brush-shell"]

# Every fork is patched, not just the ones `brush-coreutils-builtins` names.
# A utility crate may depend on another: `uu_base64` is a thin wrapper over
# `uu_base32::base_common`, so repointing only the manifest above left `base64`
# reading through an *unforked* `uu_base32` and opening host paths outside the
# mount. The batch confinement test caught it. A patch reaches transitive
# dependents too, which is the only way to be sure no such pair is missed.
#
# `uucore` is the filesystem boundary for most bundled utilities -- `cksum`
# routes to zero sites of its own because every byte it reads goes through
# `uucore::checksum` -- so the fork has to reach every consumer, not just the
# ones we forked. There are seven direct consumers (the five leaf forks,
# brush-coreutils-builtins, and brush-builtins) plus the 77 still-unforked
# crates.io `uu_*` crates, and a partial repoint is worse than none: cargo
# treats `uucore 0.10.0 (registry)` and `uucore 0.10.0 (path)` as different
# packages and links both. That is not a type error at the `uumain` seam, which
# passes only `OsString` and `i32` -- it silently splits two process globals,
# the localizer thread-local and `uucore::error::EXIT_CODE`. A patch repoints
# the whole graph at once; `cargo xtask check uucore-patch` proves it did.
[patch.crates-io]
findutils = { path = "forks/findutils" }
sed = { path = "forks/sed" }
uu_base32 = { path = "forks/uu_base32" }
uu_cat = { path = "forks/uu_cat" }
uu_comm = { path = "forks/uu_comm" }
uu_cp = { path = "forks/uu_cp" }
uu_csplit = { path = "forks/uu_csplit" }
uu_date = { path = "forks/uu_date" }
uu_dd = { path = "forks/uu_dd" }
uu_df = { path = "forks/uu_df" }
uu_dircolors = { path = "forks/uu_dircolors" }
uu_du = { path = "forks/uu_du" }
uu_expand = { path = "forks/uu_expand" }
uu_fmt = { path = "forks/uu_fmt" }
uu_fold = { path = "forks/uu_fold" }
uu_grep = { path = "forks/uu_grep" }
uu_head = { path = "forks/uu_head" }
uu_join = { path = "forks/uu_join" }
uu_link = { path = "forks/uu_link" }
uu_ln = { path = "forks/uu_ln" }
uu_ls = { path = "forks/uu_ls" }
uu_mkdir = { path = "forks/uu_mkdir" }
uu_more = { path = "forks/uu_more" }
uu_mv = { path = "forks/uu_mv" }
uu_nl = { path = "forks/uu_nl" }
uu_nproc = { path = "forks/uu_nproc" }
uu_od = { path = "forks/uu_od" }
uu_paste = { path = "forks/uu_paste" }
uu_pr = { path = "forks/uu_pr" }
uu_ptx = { path = "forks/uu_ptx" }
uu_pwd = { path = "forks/uu_pwd" }
uu_readlink = { path = "forks/uu_readlink" }
uu_realpath = { path = "forks/uu_realpath" }
uu_rm = { path = "forks/uu_rm" }
uu_rmdir = { path = "forks/uu_rmdir" }
uu_shred = { path = "forks/uu_shred" }
uu_shuf = { path = "forks/uu_shuf" }
uu_sort = { path = "forks/uu_sort" }
uu_split = { path = "forks/uu_split" }
uu_sum = { path = "forks/uu_sum" }
uu_sync = { path = "forks/uu_sync" }
uu_tac = { path = "forks/uu_tac" }
uu_tail = { path = "forks/uu_tail" }
uu_test = { path = "forks/uu_test" }
uu_touch = { path = "forks/uu_touch" }
uu_truncate = { path = "forks/uu_truncate" }
uu_tsort = { path = "forks/uu_tsort" }
uu_unexpand = { path = "forks/uu_unexpand" }
uu_uniq = { path = "forks/uu_uniq" }
uu_unlink = { path = "forks/uu_unlink" }
uu_wc = { path = "forks/uu_wc" }
uucore = { path = "forks/uucore" }

[workspace.package]
authors = ["reuben olinsky"]
categories = ["command-line-utilities", "development-tools"]
edition = "2024"
keywords = ["cli", "shell", "sh", "bash", "script"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/reubeno/brush"
rust-version = "1.88.0"

[workspace.lints.rust]
warnings = { level = "deny" }
future_incompatible = { level = "deny" }
missing_docs = { level = "deny" }
nonstandard_style = { level = "deny" }
rust_2018_idioms = { level = "deny", priority = -1 }
unnameable_types = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_attributes = "deny"
unused_lifetimes = "deny"
unused_macro_rules = "deny"
# For now we allow unknown lints so we can opt into warnings that don't exist on the
# oldest toolchain we need to support.
unknown_lints = { level = "allow", priority = -100 }

[workspace.lints.rustdoc]
all = { level = "deny", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }

# Denied rules
expect_used = "deny"
format_push_string = "deny"
multiple_unsafe_ops_per_block = "deny"
panic = "deny"
panic_in_result_fn = "deny"
string_lit_chars_any = "deny"
string_slice = "deny"
tests_outside_test_module = "deny"
todo = "deny"
unwrap_in_result = "deny"
unwrap_used = "deny"
undocumented_unsafe_blocks = "deny"

# Allowed rules
bool_to_int_with_if = "allow"
cognitive_complexity = "allow"
collapsible_else_if = "allow"
collapsible_if = "allow"
if_not_else = "allow"
if_same_then_else = "allow"
match_same_arms = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
multiple_crate_versions = "allow"
option_if_let_else = "allow"
redundant_closure_for_method_calls = "allow"
redundant_else = "allow"
redundant_pub_crate = "allow"
result_large_err = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"

[workspace.metadata.typos]
files.extend-exclude = [
    # Exclude the changelog because it's dynamically generated.
    "/CHANGELOG.md",
    # Remove this once impending mapfile updates are merged.
    "/brush-core/src/builtins/mapfile.rs",
]

[workspace.metadata.typos.default]
extend-ignore-re = [
    # -ot is a valid binary operator
    "-ot",
    # Ignore 2-letter string literals, which show up in testing a fair bit.
    '"[a-zA-Z]{2}"',
]

[workspace.metadata.typos.default.extend-words]
# These show up in tests.
"abd" = "abd"
"hel" = "hel"
"ba" = "ba"

# This is a specific technical name.
"iterm" = "iterm"

[profile.release]
strip = true
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.bench]
inherits = "release"
strip = "debuginfo"
