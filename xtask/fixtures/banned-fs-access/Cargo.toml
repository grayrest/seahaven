# Positive control for the filesystem ban. Deliberately its own workspace, so
# that `cargo clippy --workspace` at the repo root never builds it: its whole
# purpose is to fail.
[workspace]

[package]
name = "banned-fs-access"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
path = "src/lib.rs"

# Present so the platform-specific ban entries resolve here. An entry naming a
# path clippy cannot resolve is ignored in silence, so the fixture has to be
# able to name every one of them.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
nix = { version = "0.31", features = ["fs", "dir", "user", "time", "feature"] }
rustix = { version = "1.1", features = ["fs", "alloc"] }
xattr = "1"

[dependencies]
filetime = "0.2"
tempfile = "3"
