[package]
name = "brush-vfs"
description = "Virtual filesystem namespace and capability-based resolution for brush"
version = "0.1.0"
categories.workspace = true
edition.workspace = true
keywords.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
bench = false

[lints]
workspace = true

[dependencies]
cap-fs-ext = "4.0.2"
cap-primitives = "4.0.2"
cap-std = "4.0.2"
thiserror = "2.0.19"
unicode-normalization = "0.1.25"

# `symlink_metadata` opens a symlink as itself (O_PATH/O_SYMLINK, O_NOFOLLOW)
# relative to a cap-std-confined parent fd, since cap-std exposes no
# `std::fs::Metadata`-returning form. Unix only; Windows symlink handling is a
# later concern.
[target.'cfg(unix)'.dependencies]
libc = "0.2.184"

# `symlink_metadata` opens a link as itself here too, with
# `FILE_FLAG_OPEN_REPARSE_POINT`; `FILE_FLAG_BACKUP_SEMANTICS` is what lets a
# directory be opened at all. Only the two constants are needed.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59.0", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3.27.0"
# The differential gate: the walk is required to agree with `walkdir` entry for
# entry over the same tree under the identity policy. Reimplementing a mature
# traversal is the risk this milestone carries, so the reference implementation
# is a test dependency rather than an argument.
walkdir = "2.5.0"
# The fixture needs a FIFO, which std cannot create.
libc = "0.2.184"
